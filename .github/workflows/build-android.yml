name: Android APK (Unity 2022.3)

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/unity-2022-migration

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android build skipped: configure the legitimate UNITY_LICENSE repository secret to enable it."
          fi

      - name: Build with Unity
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: KaizenAndroidBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        if: steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SvZ2-Kaizen-Android-APK
          path: Build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
